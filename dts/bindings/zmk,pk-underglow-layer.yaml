description: |
  Allows defining a rgbmap composed of multiple layers

compatible: "zmk,pk-underglow-layer"

properties:
  pixel-lookup:
    type: array
    required: true
  columns:
    type: int
    required: true
    description: "The number of visual columns across the keyboard matrix."
  rows:
    type: int
    required: true
    description: "The number of visual rows across the keyboard matrix."
  center-column:
    type: int
    required: false
    description: "The visual column index to use as the center origin for radial effects like ripple and pinwheel. Defaults to the physical edge of the board."
  center-row:
    type: int
    required: false
    description: "The visual row index to use as the center origin for radial effects like ripple and pinwheel. Defaults to the physical edge of the board."
  power-gpios:
    type: phandle-array
    required: false
    description: GPIO to toggle power for the underglow LEDs.
  white-saturation:
    type: int
    required: false
    description: "Saturation level for the white effect (0-100)"
  power-stabilization-ms:
    type: int
    required: false
    default: 20
    description: "Delay in ms to allow the power circuit to stabilize before sending LED data."
  sync-delay-ms:
    type: int
    required: false
    default: 500
    description: "Initial sync delay in ms for the peripheral when connecting."
  sync-retry-ms:
    type: int
    required: false
    default: 1000
    description: "Interval in ms between sync retries to the peripheral."
  wake-sync-delay-ms:
    type: int
    required: false
    default: 100
    description: "Delay in ms before syncing the peripheral after the central wakes up."
  fps:
    type: int
    required: false
    default: 20
    description: "The frame rate (frames per second) of the underglow animations. Can be overridden by CONFIG_ZMK_PK_UNDERGLOW_FPS if set."
child-binding:
  description: "A layer to be used in a rgbmap"

  properties:
    bindings:
      type: phandle-array
      required: true
    layer-id:
      type: array
      required: true
    animated:
      type: boolean
      required: false
    fade-delay:
      type: int
      required: false
      default: -1
