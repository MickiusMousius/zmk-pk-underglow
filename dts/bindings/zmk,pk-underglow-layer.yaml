description: |
  Allows defining a rgbmap composed of multiple layers

compatible: "zmk,pk-underglow-layer"

properties:
  pixel-lookup:
    type: array
    required: true
  power-gpios:
    type: phandle-array
    required: false
    description: GPIO to toggle power for the underglow LEDs.
  white-saturation:
    type: int
    required: false
    description: "Saturation level for the white effect (0-100)"

child-binding:
  description: "A layer to be used in a rgbmap"

  properties:
    bindings:
      type: phandle-array
      required: true
    layer-id:
      type: array
      required: true
    animated:
      type: boolean
      required: false
    fade-delay:
      type: int
      required: false
      default: -1
